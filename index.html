<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>n / n' Coupled Oscillators</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header id="hud-top">
      <div id="hud-title">n / n' 結合振動子</div>
      <div id="hud-hint">ドラッグで回転 / ピンチでズーム / 点をタップで自己切替</div>
    </header>

    <section id="hud-bottom">
      <div class="slider-row">
        <label for="k-slider">結合 k <span id="k-val">0.30</span></label>
        <input
          id="k-slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.3"
        />
      </div>
      <div class="slider-row">
        <label for="n-slider">点の数 N <span id="n-val">7</span></label>
        <input id="n-slider" type="range" min="3" max="10" step="1" value="7" />
      </div>
      <div class="slider-row">
        <label for="speed-slider">速度 <span id="speed-val">1.00</span>x</label>
        <input
          id="speed-slider"
          type="range"
          min="0.1"
          max="2.5"
          step="0.05"
          value="1.0"
        />
      </div>
      <button id="reset-btn" type="button">軌跡をリセット</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
